[package]
name = "rest-api"
version = "0.1.0"
edition = "2024"

[features]
default = ["e2e"]
e2e = []

[dependencies]
# Its default `e2e` feature only selects its own tests, so it is not forwarded from here
authentication = { path = "../../outbound/authentication", default-features = false }
async-trait.workspace = true
auth-core = { path = "../../../core" }
axum.workspace = true
axum-extra.workspace = true
chrono.workspace = true
jsonwebtoken.workspace = true
kern.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true
write-model = { path = "../../outbound/write-model" }

[dev-dependencies]
mockall.workspace = true
reqwest.workspace = true
tokio.workspace = true
