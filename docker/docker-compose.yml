include:
  - ../docker/keycloak/docker-compose.yml

services: 
  auth-layer-postgres:
    image: postgres
    container_name: auth-layer-postgres
    environment:
      POSTGRES_DB: auth_layer
      POSTGRES_USER: auth_layer_admin
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.8.0
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: test
    ports:
      - "8003:80"

  keycloak-config:
    container_name: keycloak-config
    image: keycloak-config
    depends_on:
      keycloak-api:
        condition: service_healthy
    volumes:
      - ../docker/keycloak-config/setup-scripts/:/mnt/iam
    environment:
      keycloak_url: "http://keycloak-api:8080"
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "test"
      realm: "test"
      smtp_host: "smtp-server"
      smtp_port: "1025"
      IAM_email: "IAM@company.com"
      IAM_email_display_name: "IAM Company"
      api_client_id: "authentication.layer.api"
      api_client_secret: "authentication.layer.api.secret"
      end_to_end_client_id: "end.to.end.client"
      end_to_end_client_secret: "end.to.end.client.secret"
    command: |
      bash -c '
        echo "<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<"
        echo "$(date -Is) Starting iam/setup_configuration.sh..." 
        bash /mnt/iam/setup_configuration.sh
        echo "$(date -Is) Finished iam/setup_configuration.sh."
        echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>"
      '
