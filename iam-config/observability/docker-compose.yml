services:
  # OpenTelemetry Collector, Prometheus, Tempo, Loki and Grafana (http://localhost:3000)
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    container_name: otel-lgtm
    environment:
      OTELCOL_EXTRA_ARGS: "--config=file:/otel-lgtm/custom/otelcol-scrape.yaml"
    volumes:
      - ./otelcol-scrape.yaml:/otel-lgtm/custom/otelcol-scrape.yaml:ro
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
