services:
  keycloak-postgres:
    image: postgres:18.6-trixie
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_admin
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-test}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-api:
    image: keycloak-api
    build: .
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-test}
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_admin
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-test}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_METRICS_HISTOGRAMS_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-lgtm:4317
      KC_TRACING_SERVICE_NAME: keycloak-api
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  smtp-server:
    image: maildev/maildev:2.2.1
    container_name: keycloak-smtp-server
    ports:
      - "1080:1080"
      - "1025:1025"
