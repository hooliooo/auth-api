# The local cluster: one node, with the ingress controller's ports on this machine's 80 and 443,
# bound to 127.0.0.1 only. The hosts file sends keycloak-api and auth-api here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: auth-api
nodes:
  - role: control-plane
    # Pinned, so everyone runs the same Kubernetes whatever kind version they installed. To
    # upgrade: take the image for the new version from the kind release notes, then
    # dev/k8s/down.sh && dev/k8s/up.sh.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # Traefik's NodePorts (deploy/platform/traefik-values.yaml).
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      # For the e2e tests only (deploy/e2e/test-access.yaml); nothing listens without --e2e.
      # Redis, the BFF's metrics and the test helpers' controls.
      - containerPort: 30379
        hostPort: 16379
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30910
        hostPort: 19100
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30999
        hostPort: 19199
        listenAddress: "127.0.0.1"
        protocol: TCP
