# The OAuth agent, from crates/oauth-agent, behind the ingress at https://auth-api. It reaches
# Keycloak at its public address, https://keycloak-api, like browsers do (CoreDNS sends it to the
# ingress), and trusts the local CA for that from the local-ca ConfigMap. Its client key is the one
# crates/oauth-agent/dev/generate-client-key.sh made on this machine; dev/k8s/up.sh copies it into
# the oauth-agent-client-key secret.
apiVersion: v1
kind: Service
metadata:
  name: oauth-agent
  labels: { app: oauth-agent }
spec:
  selector: { app: oauth-agent }
  ports:
    - name: http
      port: 5100
    # For the OAuth proxy only; never behind the ingress.
    - name: internal
      port: 5101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-agent
  labels: { app: oauth-agent }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oauth-agent }
  template:
    metadata:
      labels: { app: oauth-agent }
    spec:
      containers:
        - name: oauth-agent
          image: auth-api/oauth-agent:dev
          imagePullPolicy: Never
          env:
            - { name: RUST_LOG, value: "oauth_agent=debug,oidc=debug,info" }
            - { name: ISSUER_URI, value: https://keycloak-api/realms/test }
            - { name: CLIENT_ID, value: oauth-agent }
            - { name: IDENTITY_PROVIDER, value: keycloak }
            - { name: CLIENT_CREDENTIALS, value: private_key_jwt }
            - { name: CLIENT_KEY_FILE, value: /run/secrets/oauth-agent/client-key.pem }
            - { name: REDIRECT_URI, value: https://auth-api/auth/callback }
            - { name: REDIS_URI, value: redis://redis:6379 }
            # The ingress sets X-Real-Ip to the client's address; only its pods (the pod
            # network) are believed.
            - { name: CLIENT_IP_HEADER, value: x-real-ip }
            - { name: TRUSTED_PROXIES, value: 10.244.0.0/16 }
            - { name: SSL_CERT_FILE, value: /etc/local-ca/ca.crt }
            # The OAuth proxy's way to fresh access tokens (crates/oauth-agent/src/internal.rs).
            - { name: INTERNAL_SECRET_FILE, value: /run/secrets/internal/secret }
          ports:
            - name: http
              containerPort: 5100
            - name: metrics
              containerPort: 9100
            - name: internal
              containerPort: 5101
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: client-key, mountPath: /run/secrets/oauth-agent, readOnly: true }
            - { name: local-ca, mountPath: /etc/local-ca, readOnly: true }
            - { name: internal, mountPath: /run/secrets/internal, readOnly: true }
      volumes:
        - name: client-key
          secret:
            secretName: oauth-agent-client-key
        - name: internal
          secret:
            secretName: oauth-agent-internal
        - name: local-ca
          configMap:
            name: local-ca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth-agent
  annotations:
    cert-manager.io/cluster-issuer: local-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [auth-api]
      secretName: auth-api-tls
  rules:
    - host: auth-api
      http:
        paths:
          - path: /
            pathType: Prefix
            # The OAuth proxy is the origin: it answers /api/* and passes the rest to the OAuth
            # agent.
            backend:
              service:
                name: oauth-proxy
                port: { name: http }
