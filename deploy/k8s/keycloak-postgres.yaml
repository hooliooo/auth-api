# Keycloak's database. A stand-in for the managed PostgreSQL production would use.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  labels: { app: keycloak-postgres }
spec:
  selector: { app: keycloak-postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
spec:
  serviceName: keycloak-postgres
  replicas: 1
  selector:
    matchLabels: { app: keycloak-postgres }
  template:
    metadata:
      labels: { app: keycloak-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-trixie
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: password }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-d", "keycloak", "-U", "keycloak_admin"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
          volumeMounts:
            # PostgreSQL 18's image keeps its data under /var/lib/postgresql/18/docker.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
