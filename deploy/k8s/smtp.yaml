# Catches the emails Keycloak sends (the realm's SMTP server). Its web UI: kubectl port-forward
# service/smtp-server 1080 -n auth-api, then http://localhost:1080.
apiVersion: v1
kind: Service
metadata:
  name: smtp-server
  labels: { app: smtp-server }
spec:
  selector: { app: smtp-server }
  ports:
    - name: smtp
      port: 1025
    - name: web
      port: 1080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-server
spec:
  replicas: 1
  selector:
    matchLabels: { app: smtp-server }
  template:
    metadata:
      labels: { app: smtp-server }
    spec:
      containers:
        - name: maildev
          image: maildev/maildev:2.2.1
          ports:
            - name: smtp
              containerPort: 1025
            - name: web
              containerPort: 1080
          resources:
            requests: { cpu: 25m, memory: 64Mi }
