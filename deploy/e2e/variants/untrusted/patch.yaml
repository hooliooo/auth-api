# Trusts no proxy, at its own address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-agent
spec:
  template:
    spec:
      containers:
        - name: oauth-agent
          ports:
            - { containerPort: 5101, $patch: delete }
          env:
            # Nothing calls a test agent's internal endpoint: it is not served.
            - { name: INTERNAL_ENDPOINT, $patch: delete }
            - { name: REDIRECT_URI, value: https://auth-api-untrusted/auth/callback }
            - { name: CLIENT_IP_HEADER, value: cf-connecting-ip }
            # TEST-NET-3: no connection ever comes from here, so the header is never believed.
            - { name: TRUSTED_PROXIES, value: 203.0.113.1/32 }
            - { name: LOGIN_RATE_LIMIT_PER_MINUTE, value: "10" }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth-agent
spec:
  tls:
    - hosts: [auth-api-untrusted]
      secretName: auth-api-untrusted-tls
  rules:
    - host: auth-api-untrusted
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth-agent-untrusted
                port: { name: http }
---
# The copied policy would still select the agent under test (kustomize does not rename Istio's
# selectors), and the test agent serves no internal endpoint to protect.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: oauth-agent
$patch: delete
---
# Nor does its Service offer the port.
apiVersion: v1
kind: Service
metadata:
  name: oauth-agent
spec:
  ports:
    - { port: 5101, $patch: delete }
