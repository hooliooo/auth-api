# Standard OpenID Connect mode, at its own address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-agent
spec:
  template:
    spec:
      containers:
        - name: oauth-agent
          env:
            - { name: IDENTITY_PROVIDER, value: oidc }
            - { name: REDIRECT_URI, value: https://auth-api-oidc/auth/callback }
            - { name: CLIENT_IP_HEADER, value: cf-connecting-ip }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth-agent
spec:
  tls:
    - hosts: [auth-api-oidc]
      secretName: auth-api-oidc-tls
  rules:
    - host: auth-api-oidc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth-agent-oidc
                port: { name: http }
