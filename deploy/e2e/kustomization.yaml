# The cluster for the OAuth agent's e2e tests (crates/oauth-agent/tests/e2e.rs): everything in
# deploy/k8s, plus the test helpers and the OAuth agent variants the tests compare against.
# dev/k8s/up.sh --e2e applies this instead of deploy/k8s. Never part of a real deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-api
resources:
  - ../k8s
  - echo-api.yaml
  - variants/oidc
  - variants/untrusted
  - test-access.yaml
patches:
  # The agent under test only: the variants were built from the same Deployment.
  - path: oauth-agent-patch.yaml
    target: { kind: Deployment, labelSelector: app=oauth-agent }
  - path: oauth-proxy-patch.yaml
