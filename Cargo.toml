[workspace]
resolver = "3"
members = [
  "app",
  "authentication",
  "core",
  "left-adapters/rest-api",
  "right-adapters/nats-event-publisher",
  "right-adapters/write-model",
]

[workspace.dependencies]
anyhow = { version = "1.0.104" }
async-nats = { version = "0.50.0" }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "tracing"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = "0.4.45"
ctor = "1.0.12"
dtor = "1.0.5"
kern = { version = "0.1.0", git = "https://github.com/hooliooo/kern.git", features = [
  "axum",
  "event_bus",
  "serde",
  "utoipa",
  "validator",
] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
mockall = "0.15.0"
regex = { version = "1.13.1", features = ["std", "logging"] }
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
# utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
sqlx = { version = "0.9.0", features = [
  "chrono",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
# Held at 0.27 to match testcontainers-modules 0.15, which pins testcontainers ^0.27.
testcontainers = { version = "0.27.3" }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3" }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = [
  "axum_extras",
  "chrono",
  "macros",
  "uuid",
] }
uuid = { version = "1.24.0", features = ["v4", "v7"] }
validator = { version = "0.21.0", features = ["derive"] }
