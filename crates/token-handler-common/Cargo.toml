[package]
name    = "token-handler-common"
version = "0.1.0"
edition = "2024"
publish = false
description = "What the token handler's OAuth agent and OAuth proxy share: the session record and its sealing, cookies, the CSRF check, request ids, client addresses, metrics, logging and graceful shutdown."

[dependencies]
axum                 = { workspace = true }
base64.workspace     = true
http                 = { workspace = true }
ring                 = { workspace = true }
serde.workspace      = true
serde_json.workspace = true
subtle               = { workspace = true }
thiserror.workspace  = true
time.workspace       = true
tokio.workspace      = true
tracing.workspace    = true
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
