[package]
name = "echo-api"
version = "0.1.0"
edition = "2024"
publish = false

# Test-only helpers for the BFF's e2e tests: a stand-in API, a fault-injecting proxy in front of
# Keycloak, and a recorder for Keycloak's back-channel logout calls.
[dependencies]
axum         = { workspace = true }
axum-server  = { version = "0.8.0", features = ["tls-rustls"] }
futures-util = "0.3"
reqwest      = { workspace = true }
rustls       = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde_json   = { workspace = true }
tokio        = { workspace = true }
