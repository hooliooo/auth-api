include:
  - ../../iam-config/docker-compose.yml

services:
  redis:
    image: redis:8.8-alpine
    container_name: bff-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  bff:
    build: 
      context: ../..
      dockerfile: crates/bff/Dockerfile
    container_name: bff
    volumes:
      # Created by dev/generate-client-key.sh. Refused if missing, rather than Docker creating
      # an empty directory in its place.
      - type: bind
        source: ./dev/client-key.pem
        target: /run/secrets/bff-client-key.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "5100:5100"
    environment:
      RUST_LOG: bff=debug,oidc=debug,info
      ISSUER_URI: http://localhost:8080/realms/test
      DISCOVERY_URI: http://keycloak-api:8080/realms/test
      CLIENT_ID: bff
      IDENTITY_PROVIDER: keycloak
      # Signed client assertions instead of a client secret, with the key each developer
      # generates locally; production keys come from a secret store.
      CLIENT_AUTH: private_key_jwt
      CLIENT_KEY_FILE: /run/secrets/bff-client-key.pem
      REDIRECT_URI: http://localhost:5100/auth/callback
      REDIS_URI: redis://redis:6379
      # Keycloak and the BFF run on plain HTTP in this dev stack; never set this in production.
      ALLOW_INSECURE_HTTP: "true"
    depends_on: 
      redis:
        condition: service_healthy
      keycloak-api:
        condition: service_healthy
    restart: on-failure
